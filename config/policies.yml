# Product API access declaration. Lists Worker Groups / Fleets and reads their Git commit
# history and diffs. Also grants, behind explicit user confirmation in the app: deploying
# a committed version, committing pending changes, and reverting a commit.
policies:
  - object: '/master/groups'
    actions: ['GET']
  - object: '/master/groups/*'
    actions: ['GET']
  - object: '/master/groups/:id/configVersion'
    actions: ['GET']
  - object: '/m/:gid/version'
    actions: ['GET']
  - object: '/m/:gid/version/*'
    actions: ['GET']
  # Version awareness: leader build version and the Cribl version each connected node runs.
  - object: '/system/info'
    actions: ['GET']
  - object: '/master/workers'
    actions: ['GET']
  # Actions mirrored from Cribl's own commit history view. Each is behind an explicit
  # confirmation naming the commit and group; nothing runs automatically.
  - object: '/master/groups/:id/deploy'
    actions: ['PATCH']
  - object: '/m/:gid/version/commit'
    actions: ['POST']
  - object: '/m/:gid/version/revert'
    actions: ['POST']
